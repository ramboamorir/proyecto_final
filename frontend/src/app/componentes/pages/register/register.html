<div class="container mt-5">

  <div class="row justify-content-center">

    <div class="col-md-5">

      <div class="card shadow">

        <div class="card-header bg-success text-white text-center">
          <h4>Registro</h4>
        </div>

        <div class="card-body">

          <form (ngSubmit)="register()" #form="ngForm">

            <div class="mb-3">
              <label>Nombre</label>
              <input type="text"
                     class="form-control"
                     [(ngModel)]="user.name"
                     name="name"
                     required>
            </div>

            <div class="mb-3">
              <label>Email</label>
              <input type="email"
                     class="form-control"
                     [(ngModel)]="user.email"
                     name="email"
                     required>
            </div>

            <div class="mb-3">
              <label>Contraseña</label>
              <input type="password"
                     class="form-control"
                     [(ngModel)]="user.password"
                     name="password"
                     required>
            </div>

            <div class="mb-3">
              <label>Rol</label>
              <select class="form-control"
                      [(ngModel)]="user.role"
                      name="role">
                <option value="user">Usuario</option>
                <option value="admin">Administrador</option>
              </select>
            </div>

            <div class="d-grid">
              <button class="btn btn-success"
                      type="submit"
                      [disabled]="form.invalid || loading">
                {{ loading ? 'Registrando...' : 'Registrarse' }}
              </button>
            </div>

          </form>

          <div class="text-center mt-3">
            <button><a routerLink="/login">Ya tengo cuenta</a></button>
          </div>

        </div>

      </div>

    </div>

  </div>

</div>
